name: Analyse et tests

on:
  push:
  pull_request:

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = 'scripts', 'lib' | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Recurse -Severity Warning,Error }
          $results | Format-Table -AutoSize
          if ($results) { exit 1 }
      - name: Compatibilité Windows PowerShell 5.1
        shell: pwsh
        run: |
          $results = 'scripts', 'lib' | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Recurse -Settings ./tests/Compatibilite-5.1.psd1 }
          $results | Format-Table -AutoSize
          if ($results) { exit 1 }
      - name: Tests sur annuaire simulé
        shell: pwsh
        run: ./tests/Test-Scripts.ps1
